<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>🧙 MiniElderMagic</title>
    <style>
        /* ==========================
           1. 基本レイアウト
           ========================== */
        html,body{
            margin:0;height:100%;overflow:hidden;
            background:#111;                 /* 黒帯を少し明るめに塗り分け */
            user-select:none; -webkit-user-select:none; -ms-user-select:none;
            //cursor: none;
        }

        /* ==========================
           2. 仮想スクリーン (1920×1080)
           ========================== */
        #game-container{
            width:1920px; height:1080px;     /* ゲーム世界の論理サイズ */
            position:absolute;               /* resize() で left/top を動かす */
            transform-origin:top left;       /* 左上基準でスケール */

            overflow:hidden;                /* ←★追加★ */

            /* ゲーム背景 */
            background:#000;
        }

        /* 2) 疑似要素で“上にかぶせる”フレーム --------------- */
        #game-container::after{
            content:'';
            position:absolute; inset:0;     /* container と同サイズ */
            border:4px solid #fff;          /* ★ 白フレーム */
            border-radius:12px;             /* ★ 角丸 */
            pointer-events:none;            /* クリック判定を透過 */
            z-index:9999;                   /* ゲーム描画より最前面へ */
        }

        /* 3) フルスクリーン時に枠を消す／残すも自由 ---------- */
        #game-container:fullscreen::after{
            /* 枠を残したいなら何もしない */
            /* 消したい場合は下をアンコメント
            border:none;
            */
        }
        /* Safari / Firefox プレフィックスは同様に ::after 付きで */
        #game-container:-webkit-full-screen{border:none;border-radius:0;} /* iOS Safari */
        #game-container:-moz-full-screen   {border:none;border-radius:0;} /* 旧 Firefox */

        /* ==========================
           3. 実際のプレイエリア
           ========================== */
        #game-area{
            width:100%; height:100%;         /* container に追従 */
            position:relative;               /* キャラを absolute で置きやすく */
            z-index: 5;       /* ★ Pawn レイヤを真ん中に固定 */
        }
        #game-ui-layer{
            position:absolute;  /* ← relative → absolute に変更 */
            inset:0;            /* 4 辺を 0 で張り付け */
            width:100%; height:100%; /* 保険として残しておいても可 */

            z-index:5;          /* #game-area より大きければ任意 */
        }

        
        /* アイテム用の丸い背景 */
        .item-round {
            position:absolute;
            display:flex;
            justify-content:center;   /* 横中央 */
            align-items:center;       /* 縦中央：ここで行ボックスを中央に */
            width:1.2em;              /* 円を少し大きめに */
            height:1.2em;
            border-radius:50%;
            font-size:1em;            /* 絵文字サイズ */
            line-height:1em;          /* ★ 行ボックス = 絵文字の高さ */
            pointer-events:none;
            background: rgba(255,255,255,0.15);  /* 好みで不透明度や色を変えてください */

            
        }


        /* ==========================
           4. キャラクター汎用スタイル
           ========================== */
        :root{ --char-size:50px; }         /* JS で再設定される */
        .character{
            position:absolute;
            font-size:var(--char-size);
            text-align:center;
            user-select:none; -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none;
        }
        
        
    </style>
</head>
<body>

<!-- ========== HTML ========= -->
<div id="game-container">

    <div id="game-area"></div> 
    <div id="game-ui-layer"></div>
</div>

<script type="module">
    /* ==========================
       5. モジュール読み込み
       ========================== */
    import { CHAR_SIZE } from './Script/GameData.js';
    import { SceneManager } from './Script/Scene/SceneManager.js';
    import { TitleScene   } from './Script/Scene/TitleScene.js';
    import { GameMainScene   } from './Script/Scene/GameMainScene.js';
    import { GameConfig, setRenderScale } from './Script/Config.js';

    globalThis.hasPad  = false;  // ← 単なるフラグだけ欲しいなら
    /* ── ❶ 初回タップ or クリックでだけ GamePad を遅延ロード ───────── */
    window.addEventListener(
        'pointerdown',
        async function initPad(evt) {
            // ─── マウス環境で非表示にしたい場合は coarse 判定を入れる ───
            const isCoarse = window.matchMedia('(pointer: coarse)').matches;
            if (!isCoarse && evt.pointerType !== 'touch') return;    // PC ではロードしない
            window.removeEventListener('pointerdown', initPad, true);     // once
            const { GamePad } = await import('./Script/Input/GamePad.js'); // パス要確認

            /* ★ Windows でも動かしてみたいときは hideOnMouse:false を指定 */
            new GamePad({
                debug      : true,      // 左上にログ
                hideOnMouse: false,     // マウス端末でも UI を表示
                scale      : 1.1        // ボタンサイズ (任意)
            });
            console.log('[GamePad] lazy-loaded');

            globalThis.hasPad  = true;  // ← 単なるフラグだけ欲しいなら
        },
        { once: true, capture: true, passive: false }                // ← cancel も拾う
    );
    
    /* ========== #game-area をワールド全体とし、サイズを倍率で決定 ========== */

    const gameTopArea = document.getElementById('game-area');

    function resizeWorld(){
        gameTopArea.style.width  = GameConfig.baseWidth  * GameConfig.renderScale + 'px';
        gameTopArea.style.height = GameConfig.baseHeight * GameConfig.renderScale + 'px';
    }
    resizeWorld();
    window.addEventListener('renderScaleChanged', resizeWorld);

    /* デバッグ：F1-F4 で倍率を即変更 */
    window.addEventListener('keydown', e=>{
        if(e.code==='F1') setRenderScale(1);
        if(e.code==='F2') setRenderScale(2);
        if(e.code==='F3') setRenderScale(3);
        if(e.code==='F4') setRenderScale(4);
    });
    
    /* フォントサイズ (絵文字サイズ) を環境変数に反映 */
    document.documentElement.style.setProperty('--char-size', `${CHAR_SIZE}px`);

    /* ==========================
       6. リサイズ / フルスクリーン対応
       ========================== */
    const BASE_W  = 1920;
    const BASE_H  = 1080;
    const BORDER  = 4;                          // CSS と合わせる
    const OUTER_W = BASE_W + BORDER*2;          // 枠込み外形
    const OUTER_H = BASE_H + BORDER*2;

    const container = document.getElementById('game-container');

    /* 画面サイズ・FS 状態に応じてスケール＆中央寄せ */
    function resize(){
        const isFS = document.fullscreenElement === container   // 要素フルスクリーン
            || document.webkitFullscreenElement === container
            || document.mozFullScreenElement === container;

        /* フルスクリーン時は枠が無いので論理サイズで計算 */
        const targetW = isFS ? BASE_W : OUTER_W;
        const targetH = isFS ? BASE_H : OUTER_H;

        const scale = Math.min(
            window.innerWidth  / targetW,
            window.innerHeight / targetH);

        container.style.transform = `scale(${scale})`;
        container.style.left = ((window.innerWidth  - targetW * scale) / 2) + 'px';
        container.style.top  = ((window.innerHeight - targetH * scale) / 2) + 'px';
    }

    /* 画面リサイズ & FS 状態変化で都度調整 */
    window.addEventListener('resize',           resize);
    document.addEventListener('fullscreenchange',resize);
    document.addEventListener('webkitfullscreenchange',resize);
    document.addEventListener('mozfullscreenchange',resize);
    resize();           // 起動直後 1 回

    /* ==========================
       7. フルスクリーン切替（任意）
       ========================== */
    /*  ダブルクリックで要素フルスクリーン切替（デバッグ用）  */
    /*
    container.addEventListener('dblclick', () => {
        if (document.fullscreenElement) {
            document.exitFullscreen?.();
        } else {
            container.requestFullscreen?.();
        }
    });
    */

    /* ==========================
       8. ゲーム起動
       ========================== */


    const gameUiLayer = document.getElementById('game-ui-layer');

    gameTopArea.style.position = 'relative';   // もしくは 'relative' でも OK
    
    export const SceneManagerInstance = new SceneManager(gameTopArea, gameUiLayer);
    await SceneManagerInstance.init();
    await SceneManagerInstance.change(new TitleScene(gameTopArea, gameUiLayer));
    
</script>
</body>
</html>
