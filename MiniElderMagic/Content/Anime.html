<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <title>🔥 Animation Test – side‑by‑side layout</title>
    <style>
        /* ======= レイアウト ======= */
        html,body{height:100%;margin:0;background:#222;color:#eee;font-family:system-ui}
        .layout{height:100%;display:flex;align-items:center;justify-content:center;gap:48px;position:relative}

        /* ======= 🔥 キャラ ======= */
        .character{
            position:absolute;
            left:50%;top:50%;transform:translate(-50%,-50%);
            display:flex;justify-content:center;align-items:center;text-align:center;
            font-size:96px;
        }

        /* ======= コントロール列 ======= */
        .controls{display:flex;flex-direction:column;gap:16px}
        .item{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
        .item button{padding:6px 14px;font-size:16px;cursor:pointer}
        .snippet{font-family:monospace;font-size:12px;line-height:1.3;width:350px;height:50px;background:#111;border:1px solid #555;color:#eee;resize:none}
        .tools{display:flex;gap:16px;align-items:center}
    </style>
</head>
<body>
<div class="layout">
    <!-- 表示キャラクター -->
    <div id="fire" class="character">🔥</div>

    <!-- コントロール列 -->
    <div class="controls">
        <div id="list"></div>
        <div class="tools">
            <label><input type="checkbox" id="loop"> Loop</label>
            <button id="resetBtn">Reset</button>
        </div>
    </div>
</div>

<!-- アニメーションライブラリ -->
<script src="animations.js"></script>

<script>
    // ページ初期化
    document.addEventListener('DOMContentLoaded', () => {
        const el        = document.getElementById('fire');
        const loop      = document.getElementById('loop');
        const resetBtn  = document.getElementById('resetBtn');
        const list      = document.getElementById('list');
        const { D, animations } = window.AnimationLib;
        let current = null;

        // ---------------- UI 生成 ----------------
        animations.forEach(a => {
            const row   = document.createElement('div');
            row.className = 'item';

            const btn   = document.createElement('button');
            btn.textContent   = a.label;
            btn.dataset.anim  = a.key;

            const ta    = document.createElement('textarea');
            ta.className  = 'snippet';
            ta.readOnly   = true;
            ta.textContent = a.code;

            row.appendChild(btn);
            row.appendChild(ta);
            list.appendChild(row);
        });

        // ---------------- 実行ロジック ----------------
        function schedule(name){
            current = name;
            setTimeout(() => {
                if (loop.checked) {
                    start(name);
                } else {
                    reset();
                }
            }, D);
        }

        function start(name){
            reset();
            const anim = animations.find(a => a.key === name);
            if(!anim) return;
            requestAnimationFrame(() => anim.func(el, schedule));
        }

        function reset(){
            el.style.transition = '';
            el.style.opacity    = '1';
            el.style.filter     = 'none';
            el.style.transform  = 'translate(-50%,-50%)';
            current = null;
        }

        // ---------------- イベント ----------------
        list.addEventListener('click', e => {
            if (e.target.tagName === 'BUTTON') start(e.target.dataset.anim);
        });
        resetBtn.addEventListener('click', reset);
    });
</script>
</body>
</html>
