<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8"/>
    <title>Emoji Map CSV Editor – Canvas Edition</title>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <style>
        :root {
            --cell: 32px
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: #222;
            color: #eee;
            font-family: system-ui, sans-serif;
            overflow: hidden;
            user-select: none
        }

        header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 16px;
            background: #111;
            border-bottom: 1px solid #444
        }

        h1 {
            font-size: 1.2rem
        }

        #mapSize {
            font-family: monospace;
            color: #6cf
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 8px 16px;
            background: #1b1b1b;
            border-bottom: 1px solid #333
        }

        .palette {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            max-height: 72px;
            overflow-x: auto
        }

        .palette button {
            width: 32px;
            height: 32px;
            font-size: 22px;
            cursor: pointer;
            border: 1px solid #555;
            background: #333;
            color: #eee
        }

        .palette .sel {
            outline: 2px solid #ff0
        }

        button, input {
            font-size: .9rem
        }

        .layer-panel {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-left: 16px
        }

        .layer-panel label {
            font-size: .85rem;
            display: flex;
            gap: 4px;
            align-items: center;
            color: #ddd
        }

        #viewport {
            width: 100%;
            height: calc(100vh - 128px);
            overflow: hidden;
            position: relative;
            cursor: grab;
            background: #000
        }

        .canvas-layer, #overlay {
            position: absolute;
            top: 0;
            left: 0;
            image-rendering: pixelated;
        }

        #overlay {
            pointer-events: none
        }
    </style>
</head>
<body>
<header>
    <h1>Emoji Map Editor – Canvas <span id="mapSize"></span></h1>
    <button id="undoBtn" title="Undo (Ctrl+Z)">⬅️ Undo</button>
    <button id="redoBtn" title="Redo (Ctrl+Y / Ctrl+Shift+Z)">Redo ➡️</button>
</header>
<div class="toolbar">
    <input type="file" id="fileInput" accept=".csv" multiple>
    <button id="downloadBtn">Download Active CSV</button>
    Brush <input type="number" id="brush" min="1" max="100" value="1" style="width:60px">
    <span id="brushInfo" style="min-width:48px">1×1</span>
    <label><input type="radio" name="mode" id="modeBrush" value="brush" checked> Brush</label>
    <label><input type="radio" name="mode" id="modeRect" value="rect"> Fill&nbsp;Rect</label>
    <div class="palette" id="palette"></div>
    <div class="layer-panel" id="layerPanel"></div>
</div>
<div id="viewport">
    <!-- layer canvases will be inserted here -->
    <canvas id="overlay"></canvas>
</div>
<script>
    /* ---------------- Config ---------------- */
    const paletteEmojis = ["", "", "", "🧱", "⛰️", "🏔️", "🌋", "🗻", "🪨", "🌊", "🟫", "🟩", "🟨", "🟥", "🟫", "🌉", "🌲", "🌳", "🌴", "🏝️", "🌾", "🍀", "🌿", "🏜️", "🪵", "🏠", "🏡", "🏘️", "🏚️", "🏕️", "⛺", "🏖️", "🏟️", "🎪", "🏛️", "🛖", "🏦", "🏰", "⛪", "🕌", "🛕", "👾", "👹", "👻", "🐉", "🧟", "👺", "🦇", "🐺", "🤖", "🎃"];
    const paletteColors = ["#0d0d0d", "#1a0000", "#330000", "#1a0d00", "#1a1400", "#443300", "#1a1a00", "#001a00", "#002233", "#00001a", "#1a0033", "#1a0014", "#0d001a", "#1a1a1a"];
    const MIN_CELL = 4, MAX_CELL = 96;
    let cellSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell')) || 32;
    let scale = 1;
    /* ---------------- State ---------------- */
    const layers = [];          // {name,grid,canvas,ctx,visible,undo,undoIdx}
    let rows = 0, cols = 0;
    let activeLayerIndex = -1;
    let selectedEmojis = [""];  // palette selection
    let brushSize = 1;
    let mode = 'brush';
    let painting = false;
    let dragStart = null;// {r,c}
    /* ---------------- DOM refs ---------------- */
    const viewport = document.getElementById('viewport');
    const overlay = document.getElementById('overlay');
    const octx = overlay.getContext('2d');
    const paletteEl = document.getElementById('palette');
    const brushEl = document.getElementById('brush');
    const brushInfo = document.getElementById('brushInfo');
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    const layerPanel = document.getElementById('layerPanel');
    const mapSizeEl = document.getElementById('mapSize');
    /* ---------------- Helpers ---------------- */
    const isColor = v => v.startsWith('#');

    function randomEmoji() {
        return selectedEmojis[Math.floor(Math.random() * selectedEmojis.length)] || "";
    }

    function parseCSV(t) {
        return t.trim().split(/\r?\n/).map(r => r.split(','));
    }

    function drawCell(layer, r, c) {
        const val = layer.grid[r][c] || "";
        const x = c * cellSize, y = r * cellSize;
        if (isColor(val)) {
            layer.ctx.fillStyle = val;
            layer.ctx.fillRect(x, y, cellSize, cellSize);
        } else {
            layer.ctx.clearRect(x, y, cellSize, cellSize);
            if (val) {
                layer.ctx.font = `${cellSize * 0.7}px serif`;
                layer.ctx.textAlign = 'center';
                layer.ctx.textBaseline = 'middle';
                layer.ctx.fillText(val, x + cellSize / 2, y + cellSize / 2);
            }
        }
    }

    function redrawLayer(layer) {
        layer.ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) drawCell(layer, r, c);
    }

    function pushHistory(layer) {
        layer.undo = layer.undo.slice(0, layer.undoIdx + 1);
        layer.undo.push(layer.grid.map(r => r.slice()));
        if (layer.undo.length > 100) layer.undo.shift();
        layer.undoIdx = layer.undo.length - 1;
        updateUndoRedoButtons();
    }

    function undo() {
        const l = layers[activeLayerIndex];
        if (!l || l.undoIdx <= 0) return;
        l.undoIdx--;
        l.grid = l.undo[l.undoIdx].map(r => r.slice());
        redrawLayer(l);
        updateUndoRedoButtons();
    }

    function redo() {
        const l = layers[activeLayerIndex];
        if (!l || l.undoIdx >= l.undo.length - 1) return;
        l.undoIdx++;
        l.grid = l.undo[l.undoIdx].map(r => r.slice());
        redrawLayer(l);
        updateUndoRedoButtons();
    }

    function updateUndoRedoButtons() {
        const l = layers[activeLayerIndex] || {undoIdx: 0, undo: [1]};
        undoBtn.disabled = l.undoIdx <= 0;
        redoBtn.disabled = l.undoIdx >= l.undo.length - 1;
    }

    /* ---------------- Palette ---------------- */
    function renderPalette() {
        paletteEl.innerHTML = '';

        function makeBtn(label, isCol) {
            const b = document.createElement('button');
            if (isCol) {
                b.style.background = label;
                b.title = label;
            } else {
                b.textContent = label || '␣';
                b.title = label || 'blank';
            }
            b.onclick = ev => {
                if (ev.shiftKey) {
                    if (selectedEmojis.includes(label)) {
                        selectedEmojis = selectedEmojis.filter(x => x !== label);
                        b.classList.remove('sel');
                    } else {
                        selectedEmojis.push(label);
                        b.classList.add('sel');
                    }
                } else {
                    selectedEmojis = [label];
                    document.querySelectorAll('.palette .sel').forEach(x => x.classList.remove('sel'));
                    b.classList.add('sel');
                }
            };
            return b;
        }

        paletteEmojis.forEach(e => paletteEl.appendChild(makeBtn(e, false)));
        paletteColors.forEach(c => paletteEl.appendChild(makeBtn(c, true)));
        paletteEl.querySelector('button').classList.add('sel');
    }

    renderPalette();

    /* ---------------- Layer handling ---------------- */
    function createCanvasLayer(w, h) {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        c.className = 'canvas-layer';
        viewport.insertBefore(c, overlay);
        return c;
    }

    function addLayer(name, grid) {
        if (layers.length === 0) {
            rows = grid.length;
            cols = grid[0].length;
            mapSizeEl.textContent = `(${rows}×${cols})`;
            overlay.width = cols * cellSize;
            overlay.height = rows * cellSize;
        } else {
            grid = grid.slice(0, rows).map(r => r.slice(0, cols));
        }
        const canvas = createCanvasLayer(cols * cellSize, rows * cellSize);
        const ctx = canvas.getContext('2d');
        const layer = {name, grid, canvas, ctx, visible: true, undo: [grid.map(r => r.slice())], undoIdx: 0, ui: null};
        layers.push(layer);
        redrawLayer(layer);
        createLayerUI(layer, layers.length - 1);
        if (activeLayerIndex === -1) setActiveLayer(0);
    }

    function createLayerUI(layer, idx) {
        const row = document.createElement('label');
        row.innerHTML = `<input type="checkbox" class="show" data-i="${idx}" checked><input type="radio" name="paint" class="paint" data-i="${idx}"> ${layer.name}`;
        layerPanel.appendChild(row);
        layer.ui = row;
        row.querySelector('.show').onchange = e => {
            layer.visible = e.target.checked;
            layer.canvas.style.visibility = layer.visible ? 'visible' : 'hidden';
        };
        row.querySelector('.paint').onchange = () => setActiveLayer(idx);
    }

    function setActiveLayer(i) {
        activeLayerIndex = i;
        document.querySelectorAll('input.paint').forEach(r => r.checked = +r.dataset.i === i);
        layers.forEach((l, idx) => {
            l.canvas.style.pointerEvents = idx === i ? 'auto' : 'none';
            if (idx === i) viewport.insertBefore(l.canvas, overlay);
        });
        updateUndoRedoButtons();
    }

    /* ---------------- Painting ---------------- */
    function paintAt(r, c) {
        const l = layers[activeLayerIndex];
        if (!l) return;
        const off = Math.floor(brushSize / 2);
        for (let dr = 0; dr < brushSize; dr++) for (let dc = 0; dc < brushSize; dc++) {
            const rr = r + dr - off, cc = c + dc - off;
            if (rr < 0 || cc < 0 || rr >= rows || cc >= cols) continue;
            const val = randomEmoji();
            l.grid[rr][cc] = val;
            drawCell(l, rr, cc);
        }
    }

    /* ---------------- Preview ---------------- */
    function clearOverlay() {
        octx.clearRect(0, 0, overlay.width, overlay.height);
    }

    function showBrushPreview(r, c) {
        clearOverlay();
        const off = Math.floor(brushSize / 2);
        octx.strokeStyle = 'yellow';
        octx.lineWidth = 1;
        octx.globalAlpha = 0.6;
        octx.strokeRect((c - off) * cellSize, (r - off) * cellSize, brushSize * cellSize, brushSize * cellSize);
        octx.globalAlpha = 1;
    }

    function showRectPreview(r1, c1, r2, c2) {
        clearOverlay();
        const rs = Math.min(r1, r2), re = Math.max(r1, r2);
        const cs = Math.min(c1, c2), ce = Math.max(c1, c2);
        octx.strokeStyle = 'yellow';
        octx.lineWidth = 1;
        octx.globalAlpha = 0.6;
        octx.strokeRect(cs * cellSize, rs * cellSize, (ce - cs + 1) * cellSize, (re - rs + 1) * cellSize);
        octx.globalAlpha = 1;
    }

    /* ---------------- Coordinate helpers ---------------- */
    function clientToCell(e) {
        const rect = viewport.getBoundingClientRect();
        const x = (e.clientX - rect.left + viewport.scrollLeft) / scale;
        const y = (e.clientY - rect.top + viewport.scrollTop) / scale;
        const c = Math.floor(x / cellSize);
        const r = Math.floor(y / cellSize);
        return [r, c];
    }

    /* ---------------- Interaction ---------------- */
    viewport.addEventListener('mousedown', e => {
        const [r, c] = clientToCell(e);
        if (e.button === 0) {
            const l = layers[activeLayerIndex];
            if (!l) return;
            if (mode === 'brush') {
                pushHistory(l);
                painting = true;
                paintAt(r, c);
                showBrushPreview(r, c);
            } else {
                dragStart = {r, c};
                showRectPreview(r, c, r, c);
            }
            e.preventDefault();
        } else if (e.button === 2) {
            viewport.dataset.panning = '1';
            viewport.style.cursor = 'grabbing';
            viewport.dataset.sx = e.clientX;
            viewport.dataset.sy = e.clientY;
            viewport.dataset.sl = viewport.scrollLeft;
            viewport.dataset.st = viewport.scrollTop;
        }
    });
    window.addEventListener('mousemove', e => {
        if (viewport.dataset.panning === '1') {
            viewport.scrollLeft = viewport.dataset.sl - (e.clientX - viewport.dataset.sx);
            viewport.scrollTop = viewport.dataset.st - (e.clientY - viewport.dataset.sy);
            return;
        }
        const [r, c] = clientToCell(e);
        if (mode === 'brush') {
            showBrushPreview(r, c);
            if (painting) paintAt(r, c);
        } else if (dragStart) {
            showRectPreview(dragStart.r, dragStart.c, r, c);
        }
    });
    window.addEventListener('mouseup', e => {
        if (viewport.dataset.panning === '1') {
            viewport.dataset.panning = '';
            viewport.style.cursor = 'grab';
            return;
        }
        const l = layers[activeLayerIndex];
        if (!l) {
            clearOverlay();
            return;
        }
        const [r, c] = clientToCell(e);
        if (mode === 'brush') {
            painting = false;
            clearOverlay();
        } else if (dragStart) {
            pushHistory(l);
            const rs = Math.min(dragStart.r, r), re = Math.max(dragStart.r, r);
            const cs = Math.min(dragStart.c, c), ce = Math.max(dragStart.c, c);
            for (let rr = rs; rr <= re; rr++) for (let cc = cs; cc <= ce; cc++) {
                const val = randomEmoji();
                l.grid[rr][cc] = val;
                drawCell(l, rr, cc);
            }
            dragStart = null;
            clearOverlay();
        }
    });
    viewport.addEventListener('contextmenu', e => {
        e.preventDefault();
        const [r, c] = clientToCell(e);
        const l = layers[activeLayerIndex];
        if (!l) return;
        pushHistory(l);
        selectedEmojis = [""];
        paintAt(r, c);
        showBrushPreview(r, c);
    });
    /* ---------------- Shortcuts ---------------- */
    window.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
            e.preventDefault();
            undo();
            return;
        }
        if (((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') || ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'z')) {
            e.preventDefault();
            redo();
            return;
        }
        const step = 64;
        switch (e.key.toLowerCase()) {
            case'w':
                viewport.scrollTop -= step;
                break;
            case's':
                viewport.scrollTop += step;
                break;
            case'a':
                viewport.scrollLeft -= step;
                break;
            case'd':
                viewport.scrollLeft += step;
                break;
        }
    });
    /* ---------------- Zoom ---------------- */
    viewport.addEventListener('wheel', e => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : 0.9;
        const newScale = Math.max(MIN_CELL / cellSize, Math.min(4, scale * factor));
        if (newScale === scale) return;
        const rect = viewport.getBoundingClientRect();
        const mx = e.clientX - rect.left + viewport.scrollLeft;
        const my = e.clientY - rect.top + viewport.scrollTop;
        const ratio = newScale / scale;
        scale = newScale;
        layers.forEach(l => l.canvas.style.transform = `scale(${scale})`);
        overlay.style.transform = `scale(${scale})`;
        viewport.scrollLeft = mx * ratio - (e.clientX - rect.left);
        viewport.scrollTop = my * ratio - (e.clientY - rect.top);
    });

    /* ---------------- Brush size ---------------- */
    function updateBrush() {
        brushSize = Math.max(1, Math.min(100, Number(brushEl.value) || 1));
        brushInfo.textContent = `${brushSize}×${brushSize}`;
    }

    brushEl.addEventListener('input', updateBrush);
    updateBrush();
    /* ---------------- File I/O ---------------- */
    document.getElementById('fileInput').addEventListener('change', e => {
        const files = [...e.target.files];
        if (!files.length) return;
        files.forEach(f => {
            const reader = new FileReader();
            reader.onload = ev => addLayer(f.name, parseCSV(ev.target.result));
            reader.readAsText(f, 'utf-8');
        });
        e.target.value = '';
    });
    document.getElementById('downloadBtn').onclick = () => {
        const l = layers[activeLayerIndex];
        if (!l) return;
        const csv = l.grid.map(r => r.join(',')).join('\n');
        const blob = new Blob([csv], {type: 'text/csv'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = l.name.replace(/\.csv$/, '') + '_edited.csv';
        a.click();
        URL.revokeObjectURL(a.href);
    };
    undoBtn.onclick = undo;
    redoBtn.onclick = redo;
    updateUndoRedoButtons();
</script>
</body>
</html>
