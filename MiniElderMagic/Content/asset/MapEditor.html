<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8"/>
    <title>Emoji Map CSV Editor – Canvas Edition</title>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <!-- ❖ 分割した CSS を読み込む -->
    <link rel="stylesheet" href="MapEditor.css">
</head>
<body>
<header>
    <h1>Emoji Map Editor – Canvas <span id="mapSize"></span></h1>
    <button id="undoBtn" title="Undo (Ctrl+Z)">⬅️ Undo</button>
    <button id="redoBtn" title="Redo (Ctrl+Y / Ctrl+Shift+Z)">Redo ➡️</button>
</header>

<div class="toolbar">
    <input type="file" id="fileInput" accept=".csv" multiple>
    <button id="downloadBtn">Download Active CSV</button>
    Brush <input type="number" id="brush" min="1" max="100" value="1" style="width:60px">
    <span id="brushInfo" style="min-width:48px">1×1</span>

    <label><input type="radio" name="mode" id="modeBrush" value="brush" checked> Brush</label>
    <label><input type="radio" name="mode" id="modeRect" value="rect"> Fill&nbsp;Rect</label>

    <div class="palette" id="palette"></div>
    <div class="layer-panel" id="layerPanel"></div>
</div>

<div id="viewport">
    <!-- layer canvases will be inserted here -->
    <canvas id="overlay"></canvas>
</div>

<!-- ❖ 分割した JS を読み込む（モジュールにするとスコープが狭まるので type="module" 推奨） -->
<script type="module" src="MapEditor.js"></script>
</body>
</html>
