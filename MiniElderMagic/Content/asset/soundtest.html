<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Emoji Map CSV Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
 :root{--cell:32px}
 *{box-sizing:border-box;margin:0;padding:0}
 body{background:#222;color:#eee;font-family:system-ui,sans-serif;overflow:hidden;user-select:none}
 header{display:flex;align-items:center;gap:16px;padding:8px 16px;background:#111;border-bottom:1px solid #444}
 h1{margin:0;font-size:1.2rem}
 #mapSize{font-family:monospace;color:#6cf}
 .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;background:#1b1b1b;border-bottom:1px solid #333}
 /* —— Palette fixed size —— */
 .palette{display:flex;gap:4px;flex-wrap:wrap;max-height:72px;overflow-x:auto}
 .palette button{width:32px;height:32px;font-size:22px;cursor:pointer;border:1px solid #555;background:#333}
 .palette .sel{outline:2px solid #ff0}
 /* —— Grid —— */
 .grid-wrap{width:100%;height:calc(100vh - 128px);overflow:hidden;cursor:grab}
 #grid{display:grid;position:relative;background:#444;grid-auto-rows:var(--cell);grid-auto-columns:var(--cell)}
 .cell{width:var(--cell);height:var(--cell);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*0.7);background:#000}
 .preview{outline:1px dashed #ff0;opacity:0.6}
 button,input{font-size:0.9rem}
</style>
</head>
<body>
<header>
  <h1>Emoji Map Editor <span id="mapSize"></span></h1>
  <button id="undoBtn" title="Undo (Ctrl+Z)">⬅️ Undo</button>
  <button id="redoBtn" title="Redo (Ctrl+Y or Ctrl+Shift+Z)">Redo ➡️</button>
</header>
<div class="toolbar">
  <input type="file" id="fileInput" accept=".csv" />
  <button id="downloadBtn">Download CSV</button>
  Brush <input type="number" id="brush" min="1" max="100" value="1" style="width:60px" />
  <span id="brushInfo" style="min-width:48px">1×1</span>
  <div class="palette" id="palette"></div>
  <span style="font-size:0.8rem;color:#aaa">(クリック:単独選択 / Shift+クリック:追加・除外 / Ctrl+Z:戻る)</span>
</div>
<div class="grid-wrap" id="viewport">
  <div id="grid"></div>
</div>
<script>
// ---------------------- Config & State ----------------------
const paletteEmojis=["","🧱","⛰️","🏔️","🗻","🪨","🏠","🏡","🏘️","🏚️","🟫","👣","🌊","🌉","🌲","🌳","🌴","🌾","🍀","🌿","💀"];
let selectedEmojis=[""]; // default eraser
let brushSize=1;
let grid=[],cells=[],rows=0,cols=0;
const gridEl=document.getElementById('grid');
const paletteEl=document.getElementById('palette');
const brushEl=document.getElementById('brush');
const brushInfo=document.getElementById('brushInfo');
const undoBtn=document.getElementById('undoBtn');
const redoBtn=document.getElementById('redoBtn');
let cellSize=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell'))||32;
const MIN_CELL=4,MAX_CELL=96;

// ---------------------- History (Undo / Redo) --------------
let history=[];let historyIndex=-1;const HISTORY_LIMIT=100;
function saveHistory(){
  history=history.slice(0,historyIndex+1);
  history.push(grid.map(r=>r.slice()));
  if(history.length>HISTORY_LIMIT){history.shift();}
  historyIndex=history.length-1;updateUndoRedoButtons();
}
function undo(){if(historyIndex<=0)return;historyIndex--;grid=history[historyIndex].map(r=>r.slice());renderGrid();updateUndoRedoButtons();}
function redo(){if(historyIndex>=history.length-1)return;historyIndex++;grid=history[historyIndex].map(r=>r.slice());renderGrid();updateUndoRedoButtons();}
function resetHistory(){history=[grid.map(r=>r.slice())];historyIndex=0;updateUndoRedoButtons();}
function updateUndoRedoButtons(){undoBtn.disabled=historyIndex<=0;redoBtn.disabled=historyIndex>=history.length-1;}

// ---------------------- Palette -----------------------------
function renderPalette(){
  paletteEl.innerHTML='';
  paletteEmojis.forEach(e=>{
    const b=document.createElement('button');
    b.textContent=e||'␣';b.title=e||'blank';b.dataset.emoji=e;
    b.onclick=ev=>{
      if(ev.shiftKey){
        if(selectedEmojis.includes(e)){selectedEmojis=selectedEmojis.filter(x=>x!==e);b.classList.remove('sel');}
        else{selectedEmojis.push(e);b.classList.add('sel');}
      }else{
        selectedEmojis=[e];document.querySelectorAll('.palette .sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
      }
    };
    paletteEl.appendChild(b);
  });
  paletteEl.querySelector('button').classList.add('sel');
}
renderPalette();

// ---------------------- CSV Loading & Rendering -------------
function loadCSV(text){
  grid=text.trim().split(/\r?\n/).map(r=>r.split(','));
  rows=grid.length;cols=grid[0].length;
  document.getElementById('mapSize').textContent=`(${rows}×${cols})`;
  renderGrid();resetHistory();
}
function renderGrid(){
  gridEl.style.gridTemplateColumns=`repeat(${cols},var(--cell))`;
  gridEl.innerHTML='';cells=[];
  for(let r=0;r<rows;r++){
    cells[r]=[];
    for(let c=0;c<cols;c++){
      const div=document.createElement('div');
      div.className='cell';div.textContent=grid[r][c]||'';div.dataset.r=r;div.dataset.c=c;
      gridEl.appendChild(div);cells[r][c]=div;
    }
  }
}

// ---------------------- Painting Logic ----------------------
function randomEmoji(){return selectedEmojis[Math.floor(Math.random()*selectedEmojis.length)]||"";}
function paint(r,c){
  const off=Math.floor(brushSize/2);
  for(let dr=0;dr<brushSize;dr++){
    for(let dc=0;dc<brushSize;dc++){
      const rr=r+dr-off,cc=c+dc-off;
      if(rr>=0&&rr<rows&&cc>=0&&cc<cols){const emoji=randomEmoji();grid[rr][cc]=emoji;cells[rr][cc].textContent=emoji;}
    }
  }
}

// ---------------------- Preview Logic -----------------------
let previewCells=[];
function clearPreview(){previewCells.forEach(div=>div.classList.remove('preview'));previewCells=[];}
function showPreview(r,c){clearPreview();const off=Math.floor(brushSize/2);for(let dr=0;dr<brushSize;dr++)for(let dc=0;dc<brushSize;dc++){const rr=r+dr-off,cc=c+dc-off;if(rr>=0&&rr<rows&&cc>=0&&cc<cols){const div=cells[rr][cc];div.classList.add('preview');previewCells.push(div);}}}

// ---------------------- Interaction -------------------------
let painting=false,panning=false,startX=0,startY=0,scrollL=0,scrollT=0;
const viewport=document.getElementById('viewport');
function cellCoords(e){const t=e.target;if(!t.classList.contains('cell'))return null;return[+t.dataset.r,+t.dataset.c];}

viewport.addEventListener('mousedown',e=>{
  const coords=cellCoords(e);
  if(e.button===2){panning=true;viewport.style.cursor='grabbing';startX=e.clientX;startY=e.clientY;scrollL=viewport.scrollLeft;scrollT=viewport.scrollTop;}
  else if(e.button===0&&coords){saveHistory();painting=true;paint(...coords);showPreview(...coords);}
});
viewport.addEventListener('mousemove',e=>{
  if(panning){viewport.scrollLeft=scrollL-(e.clientX-startX);viewport.scrollTop=scrollT-(e.clientY-startY);} 
  else{
    const coords=cellCoords(e);if(coords)showPreview(...coords);
    if(painting&&coords)paint(...coords);
  }
});
window.addEventListener('mouseup',()=>{painting=false;panning=false;viewport.style.cursor='grab';});
viewport.addEventListener('mouseleave',clearPreview);
viewport.addEventListener('contextmenu',e=>{e.preventDefault();const coords=cellCoords(e);if(coords){saveHistory();selectedEmojis=[""];paint(...coords);showPreview(...coords);}});

// ----------------- WASD scrolling ---------------------------
window.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}
  if(((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y')||((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='z')){e.preventDefault();redo();return;}
  const step=64;
  switch(e.key.toLowerCase()){
    case 'w':viewport.scrollTop-=step;break;
    case 's':viewport.scrollTop+=step;break;
    case 'a':viewport.scrollLeft-=step;break;
    case 'd':viewport.scrollLeft+=step;break;
  }
});

// ----------------- Mouse Wheel Zoom -------------------------
viewport.addEventListener('wheel',e=>{
  e.preventDefault();const factor=e.deltaY<0?1.1:0.9;const newSize=Math.max(MIN_CELL,Math.min(MAX_CELL,Math.round(cellSize*factor)));
  if(newSize===cellSize)return;const rect=viewport.getBoundingClientRect();const mx=e.clientX-rect.left+viewport.scrollLeft;const my=e.clientY-rect.top+viewport.scrollTop;const ratio=newSize/cellSize;cellSize=newSize;document.documentElement.style.setProperty('--cell',cellSize+'px');viewport.scrollLeft=mx*ratio-(e.clientX-rect.left);viewport.scrollTop=my*ratio-(e.clientY-rect.top);
},{passive:false});

// ----------------- Brush size input -------------------------
function updateBrush(){brushSize=Math.max(1,Math.min(100,Number(brushEl.value)||1));brushInfo.textContent=`${brushSize}×${brushSize}`;}
brushEl.addEventListener('input',updateBrush);updateBrush();

// ----------------- File I/O --------------------------------
fileInput.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>loadCSV(ev.target.result);r.readAsText(f,'utf-8');});
function downloadCSV(){const csv=grid.map(r=>r.join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`emoji_map_${Date.now()}.csv`;a.click();URL.revokeObjectURL(url);}

downloadBtn.onclick=downloadCSV;undoBtn.onclick=undo;redoBtn.onclick=redo;updateUndoRedoButtons();
</script>
</body>
</html>
